name: Diagnose Python 3.11 sink shutdown

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/_diagnose-python311-hang.yml"
      - "packages/szl-evidence-litellm/**"

permissions:
  contents: read

concurrency:
  group: diagnose-python311-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sink-shutdown:
    name: ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        mode: [isolated, ordered-suite]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: "3.11"

      - name: Install all packages
        run: make install

      - name: Run bounded traceback probe
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
          PYTHONUNBUFFERED: "1"
          PYTHONASYNCIODEBUG: "1"
        run: |
          set -euo pipefail
          target="packages/szl-evidence-litellm/tests/test_sink.py::TestBackpressure::test_drain_after_stall_recovers"
          if [[ "$MODE" == "ordered-suite" ]]; then
            target="packages/szl-evidence-litellm/tests"
          fi
          echo "Diagnosing ${MODE}: ${target}"
          timeout --signal=TERM --kill-after=15s 90s \
            python -X faulthandler -m pytest -vv -s \
              -o faulthandler_timeout=10 "$target"
