name: Apply cancellation-safe evidence sink fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/_diagnose-python311-hang.yml"

permissions:
  contents: write

concurrency:
  group: fix-python311-sink-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'szl-holdings/szl-platform' &&
      github.head_ref == 'fix/alignment-template-defer-hook'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Apply the verified Python 3.11 cancellation fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          sink_path = Path("packages/szl-evidence-litellm/src/szl_evidence_litellm/sink.py")
          sink = sink_path.read_text(encoding="utf-8")

          old_close = '''        if flusher is not None and not flusher.done():
              flusher.cancel()
              try:
                  await flusher
              except asyncio.CancelledError:
                  pass
          '''
          new_close = '''        if flusher is not None and not flusher.done():
              flusher.cancel()
              try:
                  async with asyncio.timeout(timeout_s):
                      await flusher
              except asyncio.CancelledError:
                  pass
              except TimeoutError as exc:
                  raise TimeoutError(
                      f"sink flusher shutdown exceeded {timeout_s}s"
                  ) from exc
          '''
          if sink.count(old_close) != 1:
              raise SystemExit("expected exactly one aclose cancellation block")
          sink = sink.replace(old_close, new_close)

          old_wait = '''            try:
                  first = await asyncio.wait_for(queue.get(), timeout=self.flush_interval_s)
              except TimeoutError:
                  continue  # idle period: nothing signed, nothing to persist
          '''
          new_wait = '''            try:
                  # ``asyncio.wait_for`` can swallow an external cancellation on
                  # Python 3.11 when queue delivery races shutdown. The timeout
                  # context distinguishes its own deadline from aclose()'s cancel.
                  async with asyncio.timeout(self.flush_interval_s):
                      first = await queue.get()
              except TimeoutError:
                  continue  # idle period: nothing signed, nothing to persist
          '''
          if sink.count(old_wait) != 1:
              raise SystemExit("expected exactly one wait_for queue block")
          sink = sink.replace(old_wait, new_wait)
          sink_path.write_text(sink, encoding="utf-8")

          test_path = Path("packages/szl-evidence-litellm/tests/test_sink.py")
          test = test_path.read_text(encoding="utf-8")
          old_test = '''            sink.enqueue(make_pending(closed_policy, call_id="a-3"))
              await sink.aclose()
          '''
          new_test = '''            sink.enqueue(make_pending(closed_policy, call_id="a-3"))
              async with asyncio.timeout(2.0):
                  await sink.aclose()
          '''
          if test.count(old_test) != 1:
              raise SystemExit("expected exactly one shutdown-race regression block")
          test = test.replace(old_test, new_test)
          test_path.write_text(test, encoding="utf-8")
          PY

          rm -f .github/workflows/_diagnose-python311-hang.yml

          git config user.name "Stephen Lutar"
          git config user.email "stephenlutar2@gmail.com"
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" -eq 3
          git commit -s -m "fix(evidence): make sink shutdown cancellation-safe"
          git push origin "HEAD:refs/heads/${GITHUB_HEAD_REF}"
