name: Apply cancellation-safe evidence sink fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/_diagnose-python311-hang.yml"

permissions:
  contents: write

concurrency:
  group: fix-python311-sink-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'szl-holdings/szl-platform' &&
      github.head_ref == 'fix/alignment-template-defer-hook'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Apply the verified Python 3.11 cancellation fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          sink_path = Path("packages/szl-evidence-litellm/src/szl_evidence_litellm/sink.py")
          sink = sink_path.read_text(encoding="utf-8")

          old_close = (
              "        if flusher is not None and not flusher.done():\n"
              "            flusher.cancel()\n"
              "            try:\n"
              "                await flusher\n"
              "            except asyncio.CancelledError:\n"
              "                pass\n"
          )
          new_close = (
              "        if flusher is not None and not flusher.done():\n"
              "            flusher.cancel()\n"
              "            try:\n"
              "                async with asyncio.timeout(timeout_s):\n"
              "                    await flusher\n"
              "            except asyncio.CancelledError:\n"
              "                pass\n"
              "            except TimeoutError as exc:\n"
              "                raise TimeoutError(\n"
              "                    f\"sink flusher shutdown exceeded {timeout_s}s\"\n"
              "                ) from exc\n"
          )
          if sink.count(old_close) != 1:
              raise SystemExit("expected exactly one aclose cancellation block")
          sink = sink.replace(old_close, new_close)

          old_wait = (
              "            try:\n"
              "                first = await asyncio.wait_for(\n"
              "                    queue.get(), timeout=self.flush_interval_s\n"
              "                )\n"
              "            except TimeoutError:\n"
              "                continue  # idle period: nothing signed, nothing to persist\n"
          )
          compact_old_wait = (
              "            try:\n"
              "                first = await asyncio.wait_for(queue.get(), timeout=self.flush_interval_s)\n"
              "            except TimeoutError:\n"
              "                continue  # idle period: nothing signed, nothing to persist\n"
          )
          if sink.count(old_wait) == 1:
              selected_wait = old_wait
          elif sink.count(compact_old_wait) == 1:
              selected_wait = compact_old_wait
          else:
              raise SystemExit("expected exactly one wait_for queue block")
          new_wait = (
              "            try:\n"
              "                # ``asyncio.wait_for`` can swallow an external cancellation on\n"
              "                # Python 3.11 when queue delivery races shutdown. The timeout\n"
              "                # context distinguishes its own deadline from aclose()'s cancel.\n"
              "                async with asyncio.timeout(self.flush_interval_s):\n"
              "                    first = await queue.get()\n"
              "            except TimeoutError:\n"
              "                continue  # idle period: nothing signed, nothing to persist\n"
          )
          sink = sink.replace(selected_wait, new_wait)
          sink_path.write_text(sink, encoding="utf-8")

          test_path = Path("packages/szl-evidence-litellm/tests/test_sink.py")
          test = test_path.read_text(encoding="utf-8")
          old_test = (
              "            sink.enqueue(make_pending(closed_policy, call_id=\"a-3\"))\n"
              "            await sink.aclose()\n"
          )
          new_test = (
              "            sink.enqueue(make_pending(closed_policy, call_id=\"a-3\"))\n"
              "            async with asyncio.timeout(2.0):\n"
              "                await sink.aclose()\n"
          )
          if test.count(old_test) != 1:
              raise SystemExit("expected exactly one shutdown-race regression block")
          test = test.replace(old_test, new_test)
          test_path.write_text(test, encoding="utf-8")
          PY

          rm -f .github/workflows/_diagnose-python311-hang.yml

          git config user.name "Stephen Lutar"
          git config user.email "stephenlutar2@gmail.com"
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" -eq 3
          git commit -s -m "fix(evidence): make sink shutdown cancellation-safe"
          git push origin "HEAD:refs/heads/${GITHUB_HEAD_REF}"
