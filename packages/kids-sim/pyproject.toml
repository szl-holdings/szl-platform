[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kids-sim"
version = "0.1.0"
description = "KIDS v0.1 golden simulator: executable specification for the KHIPU-X1 governance-first LLM accelerator ISA"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["numpy>=1.26"]
classifiers = ["Private :: Do Not Upload"]

[project.urls]
Homepage = "https://github.com/szl-holdings/szl-platform/tree/main/packages/kids-sim"
Source = "https://github.com/szl-holdings/szl-platform"
Issues = "https://github.com/szl-holdings/szl-platform/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
